<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Reflecting Creativity" />

    <!-- Open Graph for WhatsApp, Facebook, LinkedIn, iMessage -->
    <meta property="og:title" content="MirrorBook" />
